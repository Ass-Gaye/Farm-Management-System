<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Comb (red crest on top) -->
  <path d="M28 12c0-4 2-7 5-7s3 3 5 3 2-4 5-4 4 4 4 7c0 4-3 5-7 5h-6c-4 0-6-1-6-4z" fill="#E53E3E"/>
  <!-- Head (main shape) -->
  <ellipse cx="32" cy="28" rx="16" ry="18" fill="#F6AD55"/>
  <!-- Eye white -->
  <ellipse cx="26" cy="24" rx="5" ry="5.5" fill="white"/>
  <!-- Eye pupil -->
  <circle cx="27" cy="24" r="2.8" fill="#1A202C"/>
  <!-- Eye shine -->
  <circle cx="25.5" cy="22.5" r="1" fill="white"/>
  <!-- Beak top -->
  <path d="M38 28 L52 30 L40 33Z" fill="#ED8936"/>
  <!-- Beak bottom -->
  <path d="M38 33 L48 34 L40 37Z" fill="#DD6B20"/>
  <!-- Wattle (red dangly bit under beak) -->
  <ellipse cx="36" cy="42" rx="4" ry="6" fill="#E53E3E"/>
  <!-- Cheek blush -->
  <circle cx="22" cy="32" r="3.5" fill="#FBD38D" opacity="0.6"/>
